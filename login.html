<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ByronFit — Acceso</title>
  <link rel="icon" type="image/png" href="ByronFit.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <img src="ByronFit.png" alt="ByronFit" style="height:110px;width:auto;object-fit:contain;" />
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Registrarse</button>
    </div>

    <div id="auth-error" class="auth-error"></div>

    <!-- Login -->
    <form id="form-login" onsubmit="doLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="login-pass" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem" id="login-submit">
        Entrar
      </button>
    </form>

    <!-- Register -->
    <form id="form-register" style="display:none" onsubmit="doRegister(event)">
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="reg-name" placeholder="Tu nombre" required />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="tu@email.com" required />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="reg-pass" placeholder="Mínimo 6 caracteres" required minlength="6" />
      </div>
      <div class="form-group">
        <label>Objetivo principal</label>
        <select id="reg-goal">
          <option value="hipertrofia">Ganar músculo / hipertrofia</option>
          <option value="perdida">Pérdida de grasa</option>
          <option value="fuerza">Fuerza máxima</option>
          <option value="running">Running / resistencia</option>
          <option value="ciclismo">Ciclismo</option>
          <option value="salud">Salud general</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:.5rem" id="reg-submit">
        Crear cuenta
      </button>
    </form>

    <p style="margin-top:1.5rem;font-size:.75rem;text-align:center;color:var(--muted)">
      Entrenamiento personalizado
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script>
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth = firebase.auth();
    const db   = firebase.firestore();

    auth.onAuthStateChanged(async user => {
      if (!user) return;
      const doc = await db.collection('users').doc(user.uid).get();
      if (!doc.exists) return;
      redirectByRole(doc.data().role);
    });

    function redirectByRole(role) {
      if (role === 'trainer') location.href = 'trainer.html';
      else if (role === 'client') location.href = 'client.html';
    }

    function switchTab(tab) {
      document.getElementById('form-login').style.display    = tab === 'login'    ? '' : 'none';
      document.getElementById('form-register').style.display = tab === 'register' ? '' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
      hideError();
    }

    function showError(msg) {
      const el = document.getElementById('auth-error');
      el.textContent = msg; el.classList.add('show');
    }
    function hideError() { document.getElementById('auth-error').classList.remove('show'); }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading ? 'Cargando...' : (btnId === 'login-submit' ? 'Entrar' : 'Crear cuenta');
    }

    async function doLogin(e) {
      e.preventDefault(); hideError(); setLoading('login-submit', true);
      const email = document.getElementById('login-email').value.trim();
      const pass  = document.getElementById('login-pass').value;
      try {
        const cred = await auth.signInWithEmailAndPassword(email, pass);
        const doc  = await db.collection('users').doc(cred.user.uid).get();
        if (!doc.exists) { showError('Cuenta no configurada. Contacta con tu entrenador.'); auth.signOut(); return; }
        redirectByRole(doc.data().role);
      } catch(err) {
        const msgs = {
          'auth/user-not-found':    'No existe una cuenta con ese email.',
          'auth/wrong-password':    'Contraseña incorrecta.',
          'auth/invalid-credential':'Email o contraseña incorrectos.',
          'auth/too-many-requests': 'Demasiados intentos. Espera un momento.',
        };
        showError(msgs[err.code] || err.message);
      } finally { setLoading('login-submit', false); }
    }

    async function doRegister(e) {
      e.preventDefault(); hideError(); setLoading('reg-submit', true);
      const name  = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const pass  = document.getElementById('reg-pass').value;
      const goal  = document.getElementById('reg-goal').value;
      try {
        const pending   = await db.collection('pendingClients').doc(email).get();
        const isTrainer = email === TRAINER_EMAIL.toLowerCase();
        if (!isTrainer && !pending.exists) {
          showError('Tu email no tiene acceso. Pide a tu entrenador que te añada primero.');
          return;
        }
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        const role = isTrainer ? 'trainer' : 'client';
        const userData = { name, email, role, goal, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
        if (!isTrainer && pending.exists) userData.trainerId = pending.data().trainerId;
        await db.collection('users').doc(cred.user.uid).set(userData);
        if (!isTrainer && pending.exists) await db.collection('pendingClients').doc(email).delete();
        redirectByRole(role);
      } catch(err) {
        const msgs = {
          'auth/email-already-in-use': 'Ya existe una cuenta con ese email. Inicia sesión.',
          'auth/weak-password':        'Contraseña demasiado débil (mínimo 6 caracteres).',
        };
        showError(msgs[err.code] || err.message);
      } finally { setLoading('reg-submit', false); }
    }
  </script>
</body>
</html>
