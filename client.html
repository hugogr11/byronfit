<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ByronFit</title>
  <link rel="icon" type="image/png" href="ByronFit.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="client-body">

<div class="client-app">
  <header class="client-header">
    <div style="display:flex;align-items:center;gap:.5rem">
      <img src="ByronFit.png" alt="ByronFit" style="height:50px;width:auto;object-fit:contain;" />
    </div>
    <div class="client-user-btn" id="client-user-btn" onclick="toggleUserMenu()">?</div>
  </header>

  <main class="client-content" id="client-content">
    <!-- filled by JS -->
  </main>

  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-view="today">
      <span class="bnav-icon">&#9632;</span>
      <span>Hoy</span>
    </button>
    <button class="bottom-nav-item" data-view="plan">
      <span class="bnav-icon">&#8801;</span>
      <span>Plan</span>
    </button>
    <button class="bottom-nav-item" data-view="history">
      <span class="bnav-icon">&#8635;</span>
      <span>Historial</span>
    </button>
    <button class="bottom-nav-item" data-view="ai">
      <span class="bnav-icon">&#9671;</span>
      <span>Asistente</span>
    </button>
  </nav>
</div>

<!-- Complete session modal -->
<div id="modal-complete" class="modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeClientModal('modal-complete')">x</button>
    <div class="modal-title">Registrar sesion</div>
    <form id="form-complete" onsubmit="submitSession(event)">
      <div class="form-group">
        <label>Duracion real (minutos)</label>
        <input type="number" id="session-duration" min="1" max="300" value="60" />
      </div>
      <div class="form-group">
        <label>Esfuerzo percibido (RPE): <span id="rpe-label">7</span>/10</label>
        <input type="range" id="session-rpe" min="1" max="10" value="7"
               oninput="document.getElementById('rpe-label').textContent=this.value" />
      </div>
      <div class="form-group">
        <label>Notas (opcional)</label>
        <textarea id="session-notes" placeholder="Como te has sentado, que has notado..."></textarea>
      </div>
      <input type="hidden" id="complete-assignment-id" />
      <input type="hidden" id="complete-workout-id" />
      <button type="submit" class="complete-btn">Marcar como completado</button>
    </form>
  </div>
</div>

<!-- User menu (logout) -->
<div id="user-menu" style="
  display:none; position:fixed; top:3.5rem; right:1rem;
  background:var(--surface); border:1px solid var(--border2);
  border-radius:var(--r-lg); padding:.75rem;
  z-index:200; min-width:160px;
">
  <div id="menu-user-name" style="font-size:.85rem;font-weight:600;padding:.3rem .5rem;color:var(--muted2)"></div>
  <div class="divider" style="margin:.4rem 0"></div>
  <button onclick="clientLogout()" style="
    width:100%;background:none;border:none;color:var(--red);
    font-size:.88rem;padding:.4rem .5rem;cursor:pointer;
    text-align:left;border-radius:var(--r);font-family:inherit;
  ">Cerrar sesion</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="client.js"></script>
</body>
</html>
